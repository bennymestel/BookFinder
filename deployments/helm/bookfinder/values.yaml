# Default values for BookFinder Helm chart

# Frontend configuration
frontend:
  name: book-finder-frontend
  replicaCount: 1
  image:
    repository: bennymestel/book-finder-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8501
  resources:
    limits:
      cpu: 1000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi

# Backend configuration
backend:
  name: backend
  replicaCount: 1
  image:
    repository: bennymestel/book-finder-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Ingress configuration
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "true"

# Streamlit configuration
streamlit:
  server:
    enableCORS: false
    enableXsrfProtection: false
    baseUrlPath: "/"

# Chart name overrides (if needed)
nameOverride: ""
fullnameOverride: ""

# Google Books API Key
googleBooksApiKey: ""

# Service account configuration
serviceAccount:
  create: true
  name: ""
