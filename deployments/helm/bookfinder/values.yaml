# Default values for BookFinder Helm chart

# Frontend configuration
frontend:
  name: book-finder-frontend
  replicaCount: 1
  image:
    repository: bennymestel/book-finder-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8501
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi

# Backend configuration
backend:
  name: backend
  replicaCount: 1
  image:
    repository: bennymestel/book-finder-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

# Ingress configuration
ingress:
  enabled: true
  host: bookfinder.local  # Replace with your actual domain when deploying to production
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "bookfinder-ip"  # Optional: Reference a reserved static IP
    networking.gke.io/managed-certificates: "bookfinder-cert"  # Optional: For HTTPS
    networking.gke.io/v1beta1.FrontendConfig: "bookfinder-frontend-config"  # Optional: For advanced settings
  tls: []  # Uncomment and configure for HTTPS
  # - secretName: bookfinder-tls
  #   hosts:
  #     - bookfinder.example.com

# Streamlit configuration
streamlit:
  server:
    enableCORS: false
    enableXsrfProtection: false
    baseUrlPath: "/"

# Chart name overrides (if needed)
nameOverride: ""
fullnameOverride: ""

# Google Books API Key
googleBooksApiKey: ""

# Service account configuration
serviceAccount:
  create: true
  name: ""
